<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P Chat - PeerJS</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', sans-serif;
    background: #0a0a0a;
    color: #ececec;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
.app {
    width: 100%;
    max-width: 500px;
    height: 100vh;
    max-height: 800px;
    background: #0a0a0a;
    border: 1px solid #262626;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
.header {
    padding: 20px;
    background: #141414;
    border-bottom: 1px solid #262626;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #9ca3af;
}
.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ef4444;
}
.dot.online {
    background: #34d399;
    box-shadow: 0 0 12px #34d399;
}
.screen {
    flex: 1;
    display: none;
    flex-direction: column;
    overflow: hidden;
}
.screen.active { display: flex; }
.home {
    padding: 40px 24px;
    justify-content: center;
    gap: 16px;
}
.logo {
    text-align: center;
    margin-bottom: 20px;
}
.logo-icon {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #34d399, #10b981);
    border-radius: 18px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.logo h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
}
.logo p {
    font-size: 13px;
    color: #9ca3af;
}
.btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}
.btn:active { transform: scale(0.98); }
.btn-primary {
    background: #34d399;
    color: #0a0a0a;
}
.btn-secondary {
    background: #1a1a1a;
    border: 1px solid #262626;
    color: #ececec;
}
.divider {
    text-align: center;
    color: #4b5563;
    font-size: 12px;
    margin: 8px 0;
}
.setup {
    padding: 24px;
    gap: 20px;
    overflow-y: auto;
}
.step {
    background: #141414;
    border: 1px solid #262626;
    border-radius: 14px;
    padding: 18px;
}
.step h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
}
.step p {
    font-size: 12px;
    color: #9ca3af;
    line-height: 1.6;
    margin-bottom: 12px;
}
.code-box {
    background: #1a1a1a;
    border: 1px solid #262626;
    border-radius: 10px;
    padding: 12px;
    font-family: monospace;
    font-size: 14px;
    text-align: center;
    font-weight: 600;
    color: #34d399;
    margin-bottom: 10px;
    letter-spacing: 2px;
}
input {
    width: 100%;
    padding: 12px;
    background: #1a1a1a;
    border: 1px solid #262626;
    border-radius: 10px;
    color: #ececec;
    font-size: 14px;
    text-align: center;
    letter-spacing: 2px;
    font-weight: 600;
    outline: none;
}
input:focus {
    border-color: #34d399;
}
.messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.msg {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
    animation: slideIn 0.2s ease;
}
@keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.msg.me {
    align-self: flex-end;
    background: #34d399;
    color: #0a0a0a;
    border-bottom-right-radius: 4px;
}
.msg.peer {
    align-self: flex-start;
    background: #1a1a1a;
    border: 1px solid #262626;
    color: #ececec;
    border-bottom-left-radius: 4px;
}
.input-bar {
    padding: 16px;
    background: #141414;
    border-top: 1px solid #262626;
    display: flex;
    gap: 10px;
}
.input-bar input {
    flex: 1;
    text-align: left;
    letter-spacing: normal;
    font-weight: 400;
}
.send-btn {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: #34d399;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0a0a0a;
}
.send-btn:active { transform: scale(0.92); }
.back-btn {
    padding: 8px 14px;
    background: #1a1a1a;
    border: 1px solid #262626;
    border-radius: 8px;
    color: #ececec;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
}
.peer-id {
    font-size: 11px;
    color: #6b7280;
    margin-top: 8px;
}
@media (max-width: 768px) {
    .app {
        border-radius: 0;
        border: none;
        max-height: 100vh;
    }
}
</style>
</head>
<body>

<div class="app">
    <div class="header">
        <div class="status">
            <div class="dot" id="statusDot"></div>
            <span id="statusText">Offline</span>
        </div>
        <button class="back-btn" id="backBtn" style="display:none;">Back</button>
    </div>

    <div class="screen active" id="homeScreen">
        <div class="home">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="32" height="32" fill="none" stroke="#0a0a0a" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                </div>
                <h1>Peer Chat</h1>
                <p>Powered by PeerJS + Free TURN</p>
            </div>
            <button class="btn btn-primary" id="createRoom">Create Room</button>
            <div class="divider">or</div>
            <button class="btn btn-secondary" id="joinRoom">Join Room</button>
        </div>
    </div>

    <div class="screen" id="setupScreen">
        <div class="setup">
            <div class="step" id="createStep">
                <h3>Your Room ID</h3>
                <p>Share this 6-digit ID with your friend</p>
                <div class="code-box" id="myId">------</div>
                <button class="btn btn-primary" id="copyId">Copy ID</button>
                <p class="peer-id">Waiting for friend to join...</p>
            </div>
            <div class="step" id="joinStep">
                <h3>Enter Friend's Room ID</h3>
                <p>Ask your friend for their 6-digit ID</p>
                <input type="text" id="peerIdInput" placeholder="000000" maxlength="6">
                <button class="btn btn-primary" id="connectBtn" style="margin-top:12px;">Connect</button>
            </div>
        </div>
    </div>

    <div class="screen" id="chatScreen">
        <div class="messages" id="messages"></div>
        <div class="input-bar">
            <input type="text" id="msgInput" placeholder="Type a message...">
            <button class="send-btn" id="sendBtn">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                </svg>
            </button>
        </div>
    </div>
</div>

<script>
const homeScreen = document.getElementById('homeScreen');
const setupScreen = document.getElementById('setupScreen');
const chatScreen = document.getElementById('chatScreen');
const createRoom = document.getElementById('createRoom');
const joinRoom = document.getElementById('joinRoom');
const backBtn = document.getElementById('backBtn');
const myId = document.getElementById('myId');
const copyId = document.getElementById('copyId');
const peerIdInput = document.getElementById('peerIdInput');
const connectBtn = document.getElementById('connectBtn');
const messages = document.getElementById('messages');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const createStep = document.getElementById('createStep');
const joinStep = document.getElementById('joinStep');

let peer = null;
let conn = null;

function showScreen(screen) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    screen.classList.add('active');
    backBtn.style.display = screen === homeScreen ? 'none' : 'block';
}

function randomId() {
    return Math.floor(100000 + Math.random() * 900000).toString();
}

createRoom.addEventListener('click', () => {
    showScreen(setupScreen);
    createStep.style.display = 'block';
    joinStep.style.display = 'none';
    
    const id = randomId();
    peer = new Peer(id, {
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' }
            ]
        }
    });
    
    peer.on('open', (id) => {
        myId.textContent = id;
        statusText.textContent = 'Waiting...';
    });
    
    peer.on('connection', (connection) => {
        conn = connection;
        setupConnection();
    });
    
    peer.on('error', (err) => {
        alert('Connection error: ' + err.type);
        resetAll();
    });
});

joinRoom.addEventListener('click', () => {
    showScreen(setupScreen);
    createStep.style.display = 'none';
    joinStep.style.display = 'block';
    
    peer = new Peer({
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' }
            ]
        }
    });
    
    peer.on('error', (err) => {
        alert('Connection error: ' + err.type);
        resetAll();
    });
});

copyId.addEventListener('click', () => {
    navigator.clipboard.writeText(myId.textContent);
    copyId.textContent = 'Copied!';
    setTimeout(() => copyId.textContent = 'Copy ID', 2000);
});

connectBtn.addEventListener('click', () => {
    const peerId = peerIdInput.value.trim();
    if (peerId.length !== 6) return alert('Enter 6-digit ID');
    
    conn = peer.connect(peerId);
    setupConnection();
});

function setupConnection() {
    conn.on('open', () => {
        statusDot.classList.add('online');
        statusText.textContent = 'Connected';
        showScreen(chatScreen);
    });
    
    conn.on('data', (data) => {
        addMessage(data, 'peer');
    });
    
    conn.on('close', () => {
        alert('Friend disconnected');
        resetAll();
    });
    
    conn.on('error', (err) => {
        alert('Connection failed');
        resetAll();
    });
}

backBtn.addEventListener('click', () => {
    resetAll();
});

sendBtn.addEventListener('click', sendMsg);
msgInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMsg();
});

function sendMsg() {
    const text = msgInput.value.trim();
    if (!text || !conn || !conn.open) return;
    
    conn.send(text);
    addMessage(text, 'me');
    msgInput.value = '';
}

function addMessage(text, type) {
    const msg = document.createElement('div');
    msg.className = `msg ${type}`;
    msg.textContent = text;
    messages.appendChild(msg);
    messages.scrollTop = messages.scrollHeight;
}

function resetAll() {
    if (peer) peer.destroy();
    peer = null;
    conn = null;
    statusDot.classList.remove('online');
    statusText.textContent = 'Offline';
    messages.innerHTML = '';
    peerIdInput.value = '';
    myId.textContent = '------';
    showScreen(homeScreen);
}
</script>
</body>
</html>
