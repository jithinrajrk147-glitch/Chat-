<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P Room - Chat + Voice + Whiteboard</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', sans-serif;
    background: #0a0a0a;
    color: #ececec;
    height: 100vh;
    overflow: hidden;
}
.app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
}
.header {
    padding: 12px 16px;
    background: #141414;
    border-bottom: 1px solid #262626;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
}
.status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #9ca3af;
}
.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ef4444;
}
.dot.online {
    background: #34d399;
    box-shadow: 0 0 12px #34d399;
}
.controls {
    display: flex;
    gap: 8px;
}
.ctrl-btn {
    padding: 6px 12px;
    background: #1a1a1a;
    border: 1px solid #262626;
    border-radius: 8px;
    color: #ececec;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
}
.ctrl-btn.active {
    background: #34d399;
    border-color: #34d399;
    color: #0a0a0a;
}
.ctrl-btn.danger {
    background: #ef4444;
    border-color: #ef4444;
    color: #fff;
}
.screen {
    flex: 1;
    display: none;
    overflow: hidden;
}
.screen.active { display: flex; }
.home {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 16px;
}
.logo {
    text-align: center;
    margin-bottom: 20px;
}
.logo-icon {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #34d399, #10b981);
    border-radius: 18px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.logo h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
}
.logo p {
    font-size: 13px;
    color: #9ca3af;
}
.btn {
    width: 100%;
    max-width: 320px;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}
.btn:active { transform: scale(0.98); }
.btn-primary {
    background: #34d399;
    color: #0a0a0a;
}
.btn-secondary {
    background: #1a1a1a;
    border: 1px solid #262626;
    color: #ececec;
}
.setup {
    flex-direction: column;
    padding: 24px;
    gap: 20px;
    max-width: 500px;
    margin: 0 auto;
    width: 100%;
    overflow-y: auto;
}
.step {
    background: #141414;
    border: 1px solid #262626;
    border-radius: 14px;
    padding: 18px;
}
.step h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
}
.step p {
    font-size: 12px;
    color: #9ca3af;
    line-height: 1.6;
    margin-bottom: 12px;
}
.code-box {
    background: #1a1a1a;
    border: 1px solid #262626;
    border-radius: 10px;
    padding: 12px;
    font-family: monospace;
    font-size: 14px;
    text-align: center;
    font-weight: 600;
    color: #34d399;
    margin-bottom: 10px;
    letter-spacing: 2px;
}
input {
    width: 100%;
    padding: 12px;
    background: #1a1a1a;
    border: 1px solid #262626;
    border-radius: 10px;
    color: #ececec;
    font-size: 14px;
    text-align: center;
    letter-spacing: 2px;
    font-weight: 600;
    outline: none;
}
input:focus {
    border-color: #34d399;
}
.room {
    flex-direction: row;
}
.whiteboard {
    flex: 1;
    background: #fff;
    position: relative;
    display: flex;
    flex-direction: column;
}
.board-header {
    padding: 8px 12px;
    background: #141414;
    border-bottom: 1px solid #262626;
    display: flex;
    gap: 8px;
    align-items: center;
}
.color-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 2px solid #262626;
    cursor: pointer;
}
.color-btn.active {
    border-color: #34d399;
    box-shadow: 0 0 0 2px #34d399;
}
#canvas {
    flex: 1;
    cursor: crosshair;
    touch-action: none;
}
.chat-panel {
    width: 320px;
    background: #0a0a0a;
    border-left: 1px solid #262626;
    display: flex;
    flex-direction: column;
}
.messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.5;
    word-wrap: break-word;
    animation: slideIn 0.2s ease;
}
@keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}
.msg.me {
    align-self: flex-end;
    background: #34d399;
    color: #0a0a0a;
    border-bottom-right-radius: 4px;
}
.msg.peer {
    align-self: flex-start;
    background: #1a1a1a;
    border: 1px solid #262626;
    color: #ececec;
    border-bottom-left-radius: 4px;
}
.input-bar {
    padding: 12px;
    background: #141414;
    border-top: 1px solid #262626;
    display: flex;
    gap: 8px;
}
.input-bar input {
    flex: 1;
    text-align: left;
    letter-spacing: normal;
    font-weight: 400;
    font-size: 13px;
}
.send-btn {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: #34d399;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0a0a0a;
}
.send-btn:active { transform: scale(0.92); }
@media (max-width: 768px) {
   .room { flex-direction: column; }
   .chat-panel {
        width: 100%;
        height: 40vh;
        border-left: none;
        border-top: 1px solid #262626;
    }
}
</style>
</head>
<body>

<div class="app">
    <div class="header">
        <div class="status">
            <div class="dot" id="statusDot"></div>
            <span id="statusText">Offline</span>
        </div>
        <div class="controls">
            <button class="ctrl-btn" id="micBtn" style="display:none;">🎤 Mute</button>
            <button class="ctrl-btn" id="clearBtn" style="display:none;">Clear Board</button>
            <button class="ctrl-btn danger" id="leaveBtn" style="display:none;">Leave</button>
        </div>
    </div>

    <div class="screen active" id="homeScreen">
        <div class="home">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="32" height="32" fill="none" stroke="#0a0a0a" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                    </svg>
                </div>
                <h1>P2P Room</h1>
                <p>Chat + Voice + Whiteboard</p>
            </div>
            <button class="btn btn-primary" id="createRoom">Create Room</button>
            <button class="btn btn-secondary" id="joinRoom">Join Room</button>
        </div>
    </div>

    <div class="screen" id="setupScreen">
        <div class="setup">
            <div class="step" id="createStep">
                <h3>Your Room ID</h3>
                <p>Share this 6-digit ID with your friend</p>
                <div class="code-box" id="myId">------</div>
                <button class="btn btn-primary" id="copyId">Copy ID</button>
                <p style="margin-top:12px;">Waiting for friend to join...</p>
            </div>
            <div class="step" id="joinStep">
                <h3>Enter Friend's Room ID</h3>
                <p>Ask your friend for their 6-digit ID</p>
                <input type="text" id="peerIdInput" placeholder="000000" maxlength="6">
                <button class="btn btn-primary" id="connectBtn" style="margin-top:12px;">Connect</button>
            </div>
        </div>
    </div>

    <div class="screen room" id="roomScreen">
        <div class="whiteboard">
            <div class="board-header">
                <div class="color-btn active" data-color="#000000" style="background:#000"></div>
                <div class="color-btn" data-color="#ef4444" style="background:#ef4444"></div>
                <div class="color-btn" data-color="#3b82f6" style="background:#3b82f6"></div>
                <div class="color-btn" data-color="#34d399" style="background:#34d399"></div>
                <div class="color-btn" data-color="#f59e0b" style="background:#f59e0b"></div>
            </div>
            <canvas id="canvas"></canvas>
        </div>
        <div class="chat-panel">
            <div class="messages" id="messages"></div>
            <div class="input-bar">
                <input type="text" id="msgInput" placeholder="Type a message...">
                <button class="send-btn" id="sendBtn">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</div>

<audio id="remoteAudio" autoplay></audio>

<script>
const homeScreen = document.getElementById('homeScreen');
const setupScreen = document.getElementById('setupScreen');
const roomScreen = document.getElementById('roomScreen');
const createRoom = document.getElementById('createRoom');
const joinRoom = document.getElementById('joinRoom');
const myId = document.getElementById('myId');
const copyId = document.getElementById('copyId');
const peerIdInput = document.getElementById('peerIdInput');
const connectBtn = document.getElementById('connectBtn');
const messages = document.getElementById('messages');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const createStep = document.getElementById('createStep');
const joinStep = document.getElementById('joinStep');
const micBtn = document.getElementById('micBtn');
const clearBtn = document.getElementById('clearBtn');
const leaveBtn = document.getElementById('leaveBtn');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const remoteAudio = document.getElementById('remoteAudio');

let peer = null;
let conn = null;
let call = null;
let localStream = null;
let isDrawing = false;
let currentColor = '#000000';
let lastX = 0, lastY = 0;

function showScreen(screen) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    screen.classList.add('active');
    const inRoom = screen === roomScreen;
    micBtn.style.display = inRoom? 'block' : 'none';
    clearBtn.style.display = inRoom? 'block' : 'none';
    leaveBtn.style.display = inRoom? 'block' : 'none';
}

function randomId() {
    return Math.floor(100000 + Math.random() * 900000).toString();
}

// Whiteboard setup
function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height - 45;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

document.querySelectorAll('.color-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentColor = btn.dataset.color;
    });
});

function startDraw(e) {
    isDrawing = true;
    const rect = canvas.getBoundingClientRect();
    lastX = (e.clientX || e.touches[0].clientX) - rect.left;
    lastY = (e.clientY || e.touches[0].clientY) - rect.top;
}

function draw(e) {
    if (!isDrawing) return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX || e.touches[0].clientX) - rect.left;
    const y = (e.clientY || e.touches[0].clientY) - rect.top;

    ctx.strokeStyle = currentColor;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();

    // Send to peer
    if (conn && conn.open) {
        conn.send({ type: 'draw', x1: lastX, y1: lastY, x2: x, y2: y, color: currentColor });
    }

    lastX = x;
    lastY = y;
}

function stopDraw() {
    isDrawing = false;
}

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', stopDraw);
canvas.addEventListener('mouseleave', stopDraw);
canvas.addEventListener('touchstart', startDraw);
canvas.addEventListener('touchmove', draw);
canvas.addEventListener('touchend', stopDraw);

clearBtn.addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (conn && conn.open) {
        conn.send({ type: 'clear' });
    }
});

// PeerJS logic
createRoom.addEventListener('click', async () => {
    showScreen(setupScreen);
    createStep.style.display = 'block';
    joinStep.style.display = 'none';

    const id = randomId();
    peer = new Peer(id, {
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' }
            ]
        }
    });

    peer.on('open', (id) => {
        myId.textContent = id;
        statusText.textContent = 'Waiting...';
    });

    peer.on('connection', (connection) => {
        conn = connection;
        setupConnection();
    });

    peer.on('call', async (incomingCall) => {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        incomingCall.answer(localStream);
        call = incomingCall;
        call.on('stream', (stream) => {
            remoteAudio.srcObject = stream;
        });
    });

    peer.on('error', (err) => {
        alert('Error: ' + err.type);
        resetAll();
    });
});

joinRoom.addEventListener('click', () => {
    showScreen(setupScreen);
    createStep.style.display = 'none';
    joinStep.style.display = 'block';

    peer = new Peer({
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' }
            ]
        }
    });

    peer.on('error', (err) => {
        alert('Error: ' + err.type);
        resetAll();
    });
});

copyId.addEventListener('click', () => {
    navigator.clipboard.writeText(myId.textContent);
    copyId.textContent = 'Copied!';
    setTimeout(() => copyId.textContent = 'Copy ID', 2000);
});

connectBtn.addEventListener('click', async () => {
    const peerId = peerIdInput.value.trim();
    if (peerId.length!== 6) return alert('Enter 6-digit ID');

    conn = peer.connect(peerId);

    // Start voice call
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    call = peer.call(peerId, localStream);
    call.on('stream', (stream) => {
        remoteAudio.srcObject = stream;
    });

    setupConnection();
});

function setupConnection() {
    conn.on('open', () => {
        statusDot.classList.add('online');
        statusText.textContent = 'Connected';
        showScreen(roomScreen);
        resizeCanvas();
    });

    conn.on('data', (data) => {
        if (typeof data === 'string') {
            addMessage(data, 'peer');
        } else if (data.type === 'draw') {
            ctx.strokeStyle = data.color;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(data.x1, data.y1);
            ctx.lineTo(data.x2, data.y2);
            ctx.stroke();
        } else if (data.type === 'clear') {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    });

    conn.on('close', () => {
        alert('Friend disconnected');
        resetAll();
    });

    conn.on('error', () => {
        alert('Connection failed');
        resetAll();
    });
}

sendBtn.addEventListener('click', sendMsg);
msgInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMsg();
});

function sendMsg() {
    const text = msgInput.value.trim();
    if (!text ||!conn ||!conn.open) return;

    conn.send(text);
    addMessage(text, 'me');
    msgInput.value = '';
}

function addMessage(text, type) {
    const msg = document.createElement('div');
    msg.className = `msg ${type}`;
    msg.textContent = text;
    messages.appendChild(msg);
    messages.scrollTop = messages.scrollHeight;
}

micBtn.addEventListener('click', () => {
    if (!localStream) return;
    const enabled = localStream.getAudioTracks()[0].enabled;
    localStream.getAudioTracks()[0].enabled =!enabled;
    micBtn.textContent = enabled? '🔇 Unmute' : '🎤 Mute';
    micBtn.classList.toggle('active',!enabled);
});

leaveBtn.addEventListener('click', () => {
    resetAll();
});

function resetAll() {
    if (peer) peer.destroy();
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    peer = null;
    conn = null;
    call = null;
    localStream = null;
    statusDot.classList.remove('online');
    statusText.textContent = 'Offline';
    messages.innerHTML = '';
    peerIdInput.value = '';
    myId.textContent = '------';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    showScreen(homeScreen);
}
</script>
</body>
</html>
