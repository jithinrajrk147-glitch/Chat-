<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebRTC Chat - Really Free</title>
<style>
body { font-family:system-ui; background:#0d1117; color:#e6edf3; margin:0; padding:15px; }
.container { max-width:500px; margin:auto; }
h3 { margin:0 0 15px 0; }
textarea, input, button { width:100%; padding:12px; margin:6px 0; background:#161b22; border:1px solid #30363d; color:#e6edf3; border-radius:8px; box-sizing:border-box; font-size:16px; }
button { background:#238636; font-weight:bold; cursor:pointer; }
button:disabled { background:#30363d; cursor:not-allowed; }
#messages { height:50vh; overflow-y:auto; border:1px solid #30363d; padding:10px; margin:10px 0; border-radius:8px; background:#0d1117; }
.msg { margin:8px 0; padding:10px; border-radius:8px; max-width:75%; word-wrap:break-word; }
.me { background:#1f6feb; margin-left:auto; }
.them { background:#21262d; }
.system { background:#161b22; text-align:center; font-size:14px; opacity:0.7; max-width:100%; }
.hide { display:none; }
.label { font-size:14px; margin:10px 0 4px 0; opacity:0.8; }
#status { color:#7ee787; margin:10px 0; }
</style>
</head>
<body>
<div class="container">
    <h3>WebRTC Chat - ₹0, Unlimited</h3>
    
    <div id="setup">
        <button id="createBtn" onclick="create()">1. Create New Room</button>
        
        <div class="label">OR Join Friend's Room:</div>
        <textarea id="offerIn" rows="3" placeholder="Paste friend's Offer Code here"></textarea>
        <button onclick="join()">2. Join Room</button>
        
        <div id="step2" class="hide">
            <div class="label">Send this Offer Code to friend:</div>
            <textarea id="offerOut" rows="3" readonly></textarea>
            <button onclick="copy('offerOut')">Copy Offer Code</button>
            
            <div class="label">Paste friend's Answer Code here:</div>
            <textarea id="answerIn" rows="3" placeholder="Paste Answer Code here"></textarea>
            <button onclick="connect()">3. Connect</button>
        </div>
    </div>

    <div id="chat" class="hide">
        <div id="messages"></div>
        <input id="msgInput" placeholder="Type message..." onkeydown="if(event.key==='Enter')send()">
        <button onclick="send()">Send Message</button>
    </div>
    
    <div id="status"></div>
</div>

<script>
let pc, channel, isHost = false;
const status = document.getElementById('status');

function log(t) { 
    status.textContent = t;
    console.log(t);
}

async function create() {
    isHost = true;
    document.getElementById('createBtn').disabled = true;
    log('Creating room...');
    
    pc = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });
    
    channel = pc.createDataChannel('chat');
    setupChannel();
    
    pc.onicecandidate = e => {
        if (e.candidate) return;
        document.getElementById('offerOut').value = btoa(JSON.stringify(pc.localDescription));
        document.getElementById('step2').classList.remove('hide');
        log('Send Offer Code to friend via WhatsApp');
    };
    
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
}

async function join() {
    const code = document.getElementById('offerIn').value.trim();
    if(!code) return alert('Paste Offer Code first');
    log('Joining room...');
    
    pc = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });
    
    pc.ondatachannel = e => {
        channel = e.channel;
        setupChannel();
    };
    
    pc.onicecandidate = e => {
        if (e.candidate) return;
        const answerCode = btoa(JSON.stringify(pc.localDescription));
        navigator.clipboard.writeText(answerCode);
        alert('Answer Code copied! Send it back to friend');
        log('Answer copied - send to friend');
    };
    
    await pc.setRemoteDescription(JSON.parse(atob(code)));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
}

async function connect() {
    const code = document.getElementById('answerIn').value.trim();
    if(!code) return alert('Paste Answer Code first');
    await pc.setRemoteDescription(JSON.parse(atob(code)));
    log('Connecting...');
}

function setupChannel() {
    channel.onopen = () => {
        document.getElementById('setup').classList.add('hide');
        document.getElementById('chat').classList.remove('hide');
        log('Connected! Unlimited free messages');
        addMsg('Connected! Messages are P2P encrypted & free', 'system');
    };
    
    channel.onmessage = e => addMsg(e.data, 'them');
    channel.onclose = () => {
        addMsg('Friend disconnected', 'system');
        log('Disconnected');
    };
}

function send() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if(!text || !channel || channel.readyState !== 'open') return;
    
    channel.send(text);
    addMsg(text, 'me');
    input.value = '';
}

function addMsg(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    const m = document.getElementById('messages');
    m.appendChild(div);
    m.scrollTop = m.scrollHeight;
}

function copy(id) {
    const el = document.getElementById(id);
    el.select();
    document.execCommand('copy');
    log('Copied! Send to friend');
}
</script>
</body>
</html>
