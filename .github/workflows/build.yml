name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Init Capacitor if not exists
        run: |
          if [! -f "capacitor.config.json" ]; then
            echo '{"appId":"com.chat.tor","appName":"Chat Tor","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
            mkdir -p www
            cp index.html www/ 2>/dev/null || echo "no index.html in root"
          fi
          if [! -f "package.json" ]; then
            echo '{"name":"chat-tor","dependencies":{"@capacitor/core":"latest","@capacitor/android":"latest"}}' > package.json
            npm install
          fi

      - name: Add Android platform
        run: |
          if [! -d "android" ]; then
            npx cap add android
          fi
          npx cap copy

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk
