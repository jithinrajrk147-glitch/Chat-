name: Build APK
on: [push]
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: 17}
   - run: npm i @capacitor/core @capacitor/cli @capacitor/android && npx cap add android || true
   - run: npx cap copy android || true
   - run: cd android && chmod +x gradlew &&./gradlew assembleDebug
   - uses: actions/upload-artifact@v4
     with: {name: torchat-pure-tor-apk, path: android/app/build/outputs/apk/debug/*.apk}
