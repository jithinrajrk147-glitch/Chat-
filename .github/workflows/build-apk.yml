name: Build Real Tor APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Create Android
        run: |
          npm install
          npx cap add android
          npx cap copy android

      - name: Add Real Tor Library
        run: |
          echo "Adding jitpack repo..."
          sed -i "s/mavenCentral()/mavenCentral()\n maven { url \"https:\/\/jitpack.io\" }/g" android/build.gradle
          sed -i "/dependencies {/a \ implementation 'com.github.tladesignz:tor-android:0.4.9.2'" android/app/build.gradle
          cat android/app/build.gradle

      - name: Create Real TorService.java
        run: |
          mkdir -p android/app/src/main/java/com/torchatsimple
          cat > android/app/src/main/java/com/torchatsimple/TorService.java << 'EOF'
          package com.torchatsimple;
          import android.app.*;
          import android.content.Intent;
          import android.os.*;
          import android.util.Log;
          import java.io.*;
          import java.net.*;
          import java.util.Scanner;
          public class TorService extends Service {
              private Process torProcess;
              private String torDir, hsDir;
              private final int HTTP_PORT = 8080;
              @Override public void onCreate() {
                  super.onCreate();
                  torDir = getFilesDir()+"/tor_data";
                  hsDir = torDir+"/hidden_service";
                  new File(hsDir).mkdirs();
                  startForegroundService();
                  startHttp();
                  new Thread(this::startTor).start();
              }
              private void startForegroundService() {
                  try {
                      String id="tor_channel";
                      if(Build.VERSION.SDK_INT>=Build.VERSION_CODES.O){
                          NotificationChannel ch=new NotificationChannel(id,"Tor",NotificationManager.IMPORTANCE_LOW);
                          ((NotificationManager)getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(ch);
                      }
                      Notification n=new Notification.Builder(this,id).setContentTitle("TorChat Real").setContentText("Tor running").setSmallIcon(android.R.drawable.ic_lock_lock).build();
                      startForeground(1,n);
                  } catch(Exception e){}
              }
              private void startHttp() {
                  new Thread(()->{
                      try{
                          ServerSocket ss=new ServerSocket(HTTP_PORT);
                          while(true){
                              Socket c=ss.accept();
                              new Thread(()->{try{handle(c);}catch(Exception e){}}).start();
                          }
                      }catch(Exception e){}
                  }).start();
              }
              private void handle(Socket s) throws Exception {
                  BufferedReader in=new BufferedReader(new InputStreamReader(s.getInputStream()));
                  String first=in.readLine();
                  if(first==null){s.close();return;}
                  String body="";
                  if(first.contains("/getId")){
                      File f=new File(hsDir+"/hostname");
                      int w=0;
                      while(!f.exists()&&w<60){Thread.sleep(1000);w++;}
                      if(f.exists()) body=new Scanner(f).useDelimiter("\\Z").next().trim();
                      else body="BOOTSTRAPPING_"+w+"s";
                  } else { body="[]"; }
                  String resp="HTTP/1.1 200 OK\r\nAccess-Control-Allow-Origin: *\r\nContent-Type: text/plain\r\n\r\n"+body;
                  s.getOutputStream().write(resp.getBytes());
                  s.close();
              }
              private void startTor() {
                  try{
                      File torrcFile=new File(torDir,"torrc");
                      String torrc="SocksPort 9050\nDataDirectory "+torDir+"\nHiddenServiceDir "+hsDir+"\nHiddenServicePort 80 127.0.0.1:"+HTTP_PORT+"\n";
                      FileWriter fw=new FileWriter(torrcFile); fw.write(torrc); fw.close();
                      File bin=new File(getApplicationInfo().nativeLibraryDir,"libtor.so");
                      String binPath=bin.exists()?bin.getAbsolutePath():"tor";
                      ProcessBuilder pb=new ProcessBuilder(binPath,"-f",torrcFile.getAbsolutePath());
                      pb.redirectErrorStream(true);
                      torProcess=pb.start();
                      BufferedReader r=new BufferedReader(new InputStreamReader(torProcess.getInputStream()));
                      String line;
                      while((line=r.readLine())!=null) Log.i("TOR",line);
                  }catch(Exception e){Log.e("TOR","fail "+e);}
              }
              @Override public IBinder onBind(Intent i){return null;}
              @Override public void onDestroy(){if(torProcess!=null)torProcess.destroy(); super.onDestroy();}
          }
          EOF

      - name: Auto-start Tor in MainActivity
        run: |
          FILE="android/app/src/main/java/com/getcapacitor/myapp/MainActivity.java"
          sed -i "s/import android.os.Bundle;/import android.os.Bundle;\nimport android.content.Intent;/" $FILE
          sed -i "s/super.onCreate(savedInstanceState);/super.onCreate(savedInstanceState);\n startService(new Intent(this, com.torchatsimple.TorService.class));/" $FILE
          cat $FILE

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
         ./gradlew assembleDebug

      - name: Upload REAL APK
        uses: actions/upload-artifact@v4
        with:
          name: TorChat-REAL-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk