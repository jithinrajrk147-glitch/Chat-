name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm init -y && npm i @capacitor/core @capacitor/cli @capacitor/android && npx cap init TorChat com.torchatsimple --web-dir=www
      - run: npx cap add android || true
      - run: npx cap copy android || true
      - run: mkdir -p android/app/src/main/java/com/torchatsimple && cp app/src/main/java/com/torchatsimple/TorService.java android/app/src/main/java/com/torchatsimple/ || true
      - run: chmod +x android/gradlew && cd android &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: torchat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
