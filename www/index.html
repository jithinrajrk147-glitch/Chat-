<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABCC Tor - No DB</title>
<script src="https://cdn.jsdelivr.net/npm/libsodium-wrappers@0.7.13/dist/modules/sodium.js"></script>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:12px}
.box{border:1px solid #0f0;padding:10px;margin:8px 0;word-break:break-all}
input,button{width:100%;background:#111;color:#0f0;border:1px solid #0f0;padding:12px;margin:5px 0;font-size:16px}
#log{height:45vh;overflow:auto;border:1px dashed #0f0;padding:5px}
small{color:#888}
</style>
</head><body>

<h2>ABCC TOR - P2P</h2>

<div class="box">
<b>My UID / Link:</b><br>
<small id="status">Starting Tor...</small><br><br>
<span id="myLink" style="font-size:18px;font-weight:bold">...</span><br><br>
<button onclick="copyLink()">Copy My Link</button>
<small>Share this link on WhatsApp - Anyone with link can chat you direct via Tor</small>
</div>

<div class="box">
<b>Connect Friend:</b><br>
<input id="friendLink" placeholder="Paste friend's link here - abc...onion or @abc...onion|pubkey">
<button onclick="addFriend()">Add Friend</button>
<div id="friends"></div>
</div>

<div id="log"></div>
<input id="msgText" placeholder="Message to selected friend">
<button onclick="send()">Send E2E via Tor</button>

<script>
let myKeys, myOnion, myShort, friends={}, selected=null;

async function init(){
 await sodium.ready;
 let sk = localStorage.getItem('abcc_key');
 if(!sk){
   let kp = sodium.crypto_box_keypair();
   localStorage.setItem('abcc_key', JSON.stringify({pub:sodium.to_base64(kp.publicKey), priv:sodium.to_base64(kp.privateKey)}));
 }
 let k = JSON.parse(localStorage.getItem('abcc_key'));
 myKeys = {pub: sodium.from_base64(k.pub), priv: sodium.from_base64(k.priv)};

 try{
   // Real Tor - returns abc...onion
   let r = await Capacitor.Plugins.TorPlugin.startTor();
   myOnion = r.onion;
 }catch(e){
   // For testing in browser
   myOnion = "x7f3a9b2c"+Math.random().toString(36).substring(2,12)+"b2cdef1234567890abcd1234567890abcdef1234567890ab.onion";
 }

 // Auto gen small UID + full link = onion + pubkey in one link
 myShort = "@" + myOnion.substring(0,8);
 let fullLink = myOnion + "|" + k.pub; // This is your invite link
 document.getElementById('myLink').innerText = fullLink;
 document.getElementById('status').innerText = "My Short UID: " + myShort + " | ONLINE via Tor";
 log("Tor Ready: " + myShort);

 // Load saved friends
 friends = JSON.parse(localStorage.getItem('friends')||"{}");
 renderFriends();
}

function log(t){ document.getElementById('log').innerHTML += "<div>> "+t+"</div>"; }

function copyLink(){
 let l = document.getElementById('myLink').innerText;
 navigator.clipboard.writeText(l);
 log("Copied: "+l.substring(0,30)+"...");
}

function addFriend(){
 let raw = document.getElementById('friendLink').value.trim();
 if(!raw) return;
 let parts = raw.split("|");
 let onion = parts[0].replace("@","").replace("http://","").replace("https://","").trim();
 if(onion.length < 16) onion = onion; // allow short
 let pub = parts[1] || "";
 let short = "@"+onion.substring(0,8);
 friends[short] = {onion: onion, pub: pub};
 localStorage.setItem('friends', JSON.stringify(friends));
 renderFriends();
 log("Added friend: "+short+" -> "+onion.substring(0,20)+"...");
}

function renderFriends(){
 let h=""; for(let id in friends){ h+= `<div onclick="selectFriend('${id}')" style="padding:5px;cursor:pointer;border:1px solid ${selected==id?'#0f0':'#333'}">${id} - ${friends[id].onion.substring(0,15)}... ${selected==id?'[SELECTED]':''}</div>`; }
 document.getElementById('friends').innerHTML = h;
}
function selectFriend(id){ selected=id; renderFriends(); log("Selected: "+id); }

// E2E send direct via Tor phone server
async function send(){
 if(!selected){ log("Select friend first"); return; }
 let txt = document.getElementById('msgText').value.trim();
 if(!txt) return;
 let f = friends[selected];
 let nonce = sodium.randombytes_buf(sodium.crypto_box_NONCEBYTES);
 let enc = "";
 if(f.pub){
   enc = sodium.crypto_box_easy(txt, nonce, sodium.from_base64(f.pub), myKeys.priv);
   enc = sodium.to_base64(enc);
 } else {
   enc = txt; // if no pubkey, send plain but still Tor encrypted
 }
 let payload = {from: myShort, onion: myOnion, pub: JSON.parse(localStorage.getItem('abcc_key')).pub, data: enc, nonce: sodium.to_base64(nonce)};

 try{
   await fetch(`http://${f.onion}/msg`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
   log("You -> "+selected+": "+txt+" [Tor E2E]");
   document.getElementById('msgText').value="";
 }catch(e){
   log(selected+" offline - phone server only handles 10-50 online chats");
 }
}

// Called by native ChatServer.java when someone sends you msg
window.onTorMessage = (p)=>{
 try{
   let txt = p.data;
   if(p.pub){
     let dec = sodium.crypto_box_open_easy(sodium.from_base64(p.data), sodium.from_base64(p.nonce), sodium.from_base64(p.pub), myKeys.priv);
     txt = sodium.to_string(dec);
   }
   log(p.from+" -> You: "+txt+" [E2E OK via Tor]");
   // Auto add if new
   if(!friends[p.from]){ friends[p.from]={onion:p.onion, pub:p.pub}; localStorage.setItem('friends', JSON.stringify(friends)); renderFriends(); }
 }catch(e){ log("Bad decrypt from "+p.from); }
}

init();
</script>
</body></html>
