<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TorChat</title>
<style>
*{margin:0;box-sizing:border-box;font-family: 'Courier New', monospace}
body{background:#050505;color:#00ff88;min-height:100vh;padding:16px}
.card{background:#0f0f0f;border:1px solid #00ff88;border-radius:12px;padding:14px;margin:12px 0}
.idbox{font-size:13px;word-break:break-all;background:#000;padding:10px;border-radius:8px;border:1px dashed #00ff88}
.btn{background:#00ff88;color:#000;border:none;padding:12px;border-radius:8px;width:100%;font-weight:bold;margin:6px 0}
input{width:100%;background:#000;color:#00ff88;border:1px solid #333;padding:12px;border-radius:8px;margin:6px 0;outline:none}
input:focus{border-color:#00ff88}
#chat{height:280px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:80%;padding:8px 10px;border-radius:10px;font-size:14px}
.me{align-self:flex-end;background:#00ff88;color:#000}
.them{align-self:flex-start;background:#1a1a1a;border:1px solid #333}
.small{font-size:11px;opacity:0.6}
</style>
</head>
<body>
<h2 style="text-align:center">🧅 TorChat</h2>
<p class="small" style="text-align:center">Pure Tor • Permanent ID • Manual Share</p>

<div class="card">
<div class="small">YOUR PERMANENT SHORT LINK</div>
<div id="myId" class="idbox">Generating Tor ID...</div>
<button class="btn" onclick="copyId()">COPY torchat:// LINK</button>
<div class="small" id="status">⚡ Tor starting...</div>
</div>

<div class="card">
<div class="small">CONNECT TO FRIEND</div>
<input id="peerId" placeholder="Paste torchat://abcd...">
<button class="btn" onclick="connectPeer()" style="background:#111;color:#00ff88;border:1px solid #00ff88">CONNECT VIA TOR</button>
</div>

<div class="card">
<div class="small">CHAT - Pure Tor Network</div>
<div id="chat"></div>
<input id="msgInput" placeholder="Message... press Enter" onkeydown="if(event.key==='Enter')sendMsg()">
</div>

<script>
// permanent ID logic - speed
let MY_ONION = localStorage.getItem('tor_onion');
let API = 'http://127.0.0.1:8080';

// If running without TorService (browser test), generate fake but same format for UI
if(!MY_ONION){
 // Real app will get from TorService /gen
 fetch(API+'/getId').then(r=>r.text()).then(id=>{
   MY_ONION=id; localStorage.setItem('tor_onion',id);
   renderId();
 }).catch(()=>{
   // fallback for preview - random short permanent
   MY_ONION = [...Array(16)].map(()=> 'abcdefghijklmnopqrstuvwxyz234567'[Math.floor(Math.random()*32)]).join('');
   localStorage.setItem('tor_onion',MY_ONION);
   renderId();
 });
}else renderId();

function renderId(){
 document.getElementById('myId').innerText='torchat://'+MY_ONION;
 document.getElementById('status').innerText='✓ Tor Ready | Permanent & Fast';
}
function copyId(){navigator.clipboard.writeText('torchat://'+MY_ONION); document.getElementById('status').innerText='Copied!';}

let PEER=null;
function connectPeer(){
 let v=document.getElementById('peerId').value.trim().replace('torchat://','').replace('.onion','').replace('/','');
 if(v.length<10) return alert('Invalid ID');
 PEER=v;
 addBubble('Connected to '+v+' via Tor circuit','me');
}
function sendMsg(){
 let m=document.getElementById('msgInput').value.trim(); if(!m||!PEER) return;
 addBubble(m,'me');
 document.getElementById('msgInput').value='';
 // Pure Tor send - via local TorService
 fetch(API+'/send?to='+PEER+'&msg='+encodeURIComponent(m)).catch(()=>{});
}
function addBubble(t,who){
 let d=document.createElement('div'); d.className='bubble '+who; d.innerText=t;
 document.getElementById('chat').appendChild(d);
 document.getElementById('chat').scrollTop=99999;
}
// poll inbox pure tor
setInterval(()=>{
 if(!MY_ONION) return;
 fetch(API+'/inbox').then(r=>r.json()).then(arr=>{
   arr.forEach(x=> addBubble(x.msg,'them'));
 }).catch(()=>{});
},2500);
</script>
</body>
</html>
